name: Test

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
            - run: npm ci
            - name: Check npm cooldown
              run: npm pack --dry-run caniuse-lite@1.0.30001826
            - run: npm run lint
            - run: npm test
            - run: npm run build
            - name: Check for uncommitted build file
              run: git diff --exit-code
